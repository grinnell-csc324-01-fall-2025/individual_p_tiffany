<body style="font-family: Arial; margin: 2rem;">
  <h1>Experiment 1: UI Usability Prototype</h1>
  
  <p>Task: Log your mood and get feedback.</p>
  
  <form>
    <label for="mood">How are you feeling today?</label><br>
    <input type="text" id="mood" name="mood" placeholder="Type your mood..." />
    <br><br>
    <button type="button">Get Feedback</button>
  </form>
  
  <hr>
  <p><strong>Feedback will appear here (placeholder).</strong></p>
</body>
